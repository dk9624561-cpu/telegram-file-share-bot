services:
  - type: web
    name: telegram-file-share-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: SOURCE_CHANNEL_ID
        sync: false
      - key: DESTINATION_CHANNEL_ID
        sync: false
      - key: DAILY_LIMIT
        value: "5"
